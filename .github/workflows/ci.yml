name: Cross-platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: DMS-Name-Matching-Windows-x64
          - name: Linux x64
            os: ubuntu-latest
            artifact: DMS-Name-Matching-Linux-x64
          - name: macOS
            os: macos-latest
            artifact: DMS-Name-Matching-macOS
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Assemble engine source
        shell: bash
        run: |
          cat source_parts/engine.rs.part* > app/src/engine.rs
          test -s app/src/engine.rs
          echo "engine.rs bytes: $(wc -c < app/src/engine.rs)"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Generate lockfile
        shell: bash
        working-directory: app
        run: cargo generate-lockfile

      - name: Cargo check
        shell: bash
        working-directory: app
        run: cargo check

      - name: Unit tests
        shell: bash
        working-directory: app
        run: cargo test --all-targets

      - name: Release build
        shell: bash
        working-directory: app
        run: cargo build --release

      - name: Smoke test
        shell: bash
        working-directory: app
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            test -f target/release/dms-name-matching.exe
          else
            test -f target/release/dms-name-matching
          fi

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "dist/windows"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "app/target/release/dms-name-matching.exe" "$dist/DMS_Name_Matching.exe"
          @'
          @echo off
          cd /d "%~dp0"
          start "DMS Name Matching" "%~dp0DMS_Name_Matching.exe"
          '@ | Set-Content -Encoding ASCII "$dist/DMS Name Matching.bat"
          Get-FileHash "$dist/DMS_Name_Matching.exe" -Algorithm SHA256 | Format-List | Out-File "$dist/SHA256.txt"

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/linux
          cp app/target/release/dms-name-matching dist/linux/DMS_Name_Matching
          chmod +x dist/linux/DMS_Name_Matching
          sha256sum dist/linux/DMS_Name_Matching > dist/linux/SHA256.txt

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/macos
          cp app/target/release/dms-name-matching dist/macos/DMS_Name_Matching
          chmod +x dist/macos/DMS_Name_Matching
          shasum -a 256 dist/macos/DMS_Name_Matching > dist/macos/SHA256.txt

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/windows
          if-no-files-found: error

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/linux
          if-no-files-found: error

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/macos
          if-no-files-found: error
