name: Cross-platform CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: DMS-Name-Matching-Windows-x64
          - name: Linux x64
            os: ubuntu-latest
            artifact: DMS-Name-Matching-Linux-x64
          - name: macOS
            os: macos-latest
            artifact: DMS-Name-Matching-macOS

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract uploaded source package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path source) { Remove-Item source -Recurse -Force }
          New-Item -ItemType Directory -Path source | Out-Null
          Expand-Archive -LiteralPath "DMS_Name_Matching_Rust_v11_3_3_COMPLETE.zip" -DestinationPath source -Force

      - name: Extract uploaded source package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          rm -rf source
          mkdir source
          unzip -q DMS_Name_Matching_Rust_v11_3_3_COMPLETE.zip -d source

      - name: Locate Rust application
        shell: bash
        run: |
          MANIFEST="$(find source -type f -name Cargo.toml -print -quit)"
          if [ -z "$MANIFEST" ]; then
            echo "Cargo.toml was not found in the uploaded package."
            find source -maxdepth 4 -type f | sort | head -200
            exit 1
          fi
          APP_DIR="$(dirname "$MANIFEST")"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"
          echo "Rust application: $APP_DIR"
          test -f "$APP_DIR/src/main.rs"

      - name: Apply v11.4.0 application overlay
        shell: bash
        run: |
          unzip -qo overlay/v11.4.0-ui-auth-output.zip -d "$APP_DIR"
          python - <<'PY'
          import os
          from pathlib import Path
          app = Path(os.environ["APP_DIR"])
          cargo = app / "Cargo.toml"
          text = cargo.read_text(encoding="utf-8").replace('version = "11.3.3"', 'version = "11.4.0"')
          cargo.write_text(text, encoding="utf-8")
          model = app / "src" / "model.rs"
          text = model.read_text(encoding="utf-8").replace('11.3.3-rust-web', '11.4.0-rust-web')
          model.write_text(text, encoding="utf-8")
          PY
          test -f "$APP_DIR/src/web_ui.rs"
          test -f "$APP_DIR/web/app.js"
          node --check "$APP_DIR/web/app.js"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Generate lockfile
        shell: bash
        run: cargo generate-lockfile --manifest-path "$MANIFEST"

      - name: Cargo check
        shell: bash
        run: cargo check --manifest-path "$MANIFEST"

      - name: Unit tests
        shell: bash
        run: cargo test --manifest-path "$MANIFEST" --all-targets

      - name: Release build
        shell: bash
        run: cargo build --release --manifest-path "$MANIFEST"

      - name: Verify release executable
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            test -f "$APP_DIR/target/release/dms-name-matching.exe"
          else
            test -f "$APP_DIR/target/release/dms-name-matching"
          fi

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "dist/windows"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "$env:APP_DIR/target/release/dms-name-matching.exe" "$dist/DMS_Name_Matching.exe"
          @'
          @echo off
          cd /d "%~dp0"
          start "DMS Name Matching" "%~dp0DMS_Name_Matching.exe"
          '@ | Set-Content -Encoding ASCII "$dist/DMS Name Matching.bat"
          Get-FileHash "$dist/DMS_Name_Matching.exe" -Algorithm SHA256 | Format-List | Out-File "$dist/SHA256.txt"

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/linux
          cp "$APP_DIR/target/release/dms-name-matching" dist/linux/DMS_Name_Matching
          chmod +x dist/linux/DMS_Name_Matching
          sha256sum dist/linux/DMS_Name_Matching > dist/linux/SHA256.txt

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/macos
          cp "$APP_DIR/target/release/dms-name-matching" dist/macos/DMS_Name_Matching
          chmod +x dist/macos/DMS_Name_Matching
          shasum -a 256 dist/macos/DMS_Name_Matching > dist/macos/SHA256.txt

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/windows
          if-no-files-found: error

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/linux
          if-no-files-found: error

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/macos
          if-no-files-found: error
