[package]
name = "dms-name-matching"
version = "11.3.3"
edition = "2024"
rust-version = "1.98"
description = "High-volume DMS name matching and deduplication engine"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
anyhow = "=1.0.100"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "serde"] }
crossbeam-channel = "=0.5.15"
csv = "=1.4.0"
md5 = "=0.7.0"
mysql = { version = "=27.0.0", default-features = false, features = ["minimal-rust", "chrono"] }
num_cpus = "=1.17.0"
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
strsim = "=0.11.1"
unicode-normalization = "=0.1.24"

bytemuck = { version = "=1.23.2", features = ["derive"], optional = true }
pollster = { version = "=0.4.0", optional = true }
wgpu = { version = "=30.0.1", features = ["wgsl"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1
